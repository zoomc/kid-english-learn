<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>自然拼读目录 · 宝贝英语乐园</title>
  <meta name="theme-color" content="#cdeeff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="../" aria-label="回首页">🏠</a>
    <span class="brand">🔤 自然拼读</span>
    <span class="spacer"></span>
    <span class="chip" id="coins">🪙 0</span>
    <button class="icon-btn" id="settings" aria-label="设置">⚙️</button>
  </header>

  <main class="wrap">
    <section class="talk" style="margin: 4px 0 6px">
      <div id="mascot"></div>
      <div class="bubble" id="tip">从第 1 关开始一步步闯关，也可以直接点你正在学的家族。每个家族里有好几种拼法，它们都发同一个音哦！</div>
    </section>
    <div id="levels"></div>
  </main>

  <footer class="footer">学习路线参考 Oxford Phonics World、Jolly Phonics、英国 Letters and Sounds 的进阶顺序</footer>

  <script src="../js/phonics-data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/catalog.js"></script>
</body>
</html>
